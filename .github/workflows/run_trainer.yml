name: ProfitForge Canonical Hourly Cycle

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
  pull_request:

concurrency:
  group: profitforge-canonical-hourly-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python compilation
        run: |
          python -m compileall -q trainer_daemon.py monitor_trades.py config.py adapters db risk notifications research

      - name: Run P0 unit tests
        run: |
          pytest -q tests/test_p0_hardening.py

      - name: Run P1 strategy-integrity tests
        run: |
          pytest -q tests/test_p1_strategy_integrity.py

      - name: Run canonical signal cycle
        if: github.event_name != 'pull_request'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ACCOUNT_EQUITY_USDT: ${{ secrets.ACCOUNT_EQUITY_USDT || '0' }}
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE || '0.0075' }}
        run: |
          python trainer_daemon.py

      - name: Monitor active signals
        if: github.event_name != 'pull_request' && always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ACCOUNT_EQUITY_USDT: ${{ secrets.ACCOUNT_EQUITY_USDT || '0' }}
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE || '0.0075' }}
        run: |
          python monitor_trades.py

      - name: Persist canonical database
        if: github.event_name != 'pull_request' && always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/trading.db

          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi

          git commit -m "ProfitForge: sync canonical trading database [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
